name: qwen38-flash-next

# =============================================================================
# Qwen 3.8 Flash-Next — MTP profile (drluoto/llama.cpp, Vulkan/RADV)
#
# Container for the MTP configuration validated on this box: the drluoto
# `strix-halo-vulkan` branch (pinned in drluoto/Dockerfile), the FR-Spec
# MTP-only draft head, and the server flags that validation run used.
#
#   docker compose --profile drluoto up -d --build
#   curl -s http://127.0.0.1:8080/health
# =============================================================================

services:

  qwen-drluoto-mtp:

    # --- Image ---------------------------------------------------------------
    # This profile builds its own image and needs nothing on disk but the
    # weights: the engine is cloned inside the build, pinned to ba5354d46.
    # Only the drluoto/llama.cpp fork reads the FR-Spec draft head.
    build:
      context: ./drluoto
      dockerfile: Dockerfile
    image: drluoto-llamacpp:strix-halo-vulkan

    profiles:
      - drluoto

    restart: unless-stopped

    # --- Devices -------------------------------------------------------------
    # RADV talks to the GPU through the render node. /dev/kfd (KFD/HSA compute)
    # is not needed by the Vulkan backend, so it is not passed through.
    devices:
      - /dev/dri:/dev/dri

    # Required for userspace GPU access under a default seccomp policy.
    security_opt:
      - seccomp=unconfined

    environment:
      # This branch's fused GDN state-cache path is broken on the 8060S and
      # corrupts output. This profile runs with the fusion disabled.
      GGML_VK_DISABLE_GDN_CACHE_FUSION: "1"

    volumes:
      # IMPORTANT: ~/Models should live on your fastest NVMe — this profile
      # loads with -lm dio (O_DIRECT), so it needs a local filesystem.
      - ~/Models:/models:ro

    secrets:
      - qwen_api_key

    ports:
      - "0.0.0.0:8080:8080"

    # Model load is ~90 GiB: leave time to shut down cleanly.
    stop_grace_period: 30s

    # --- Server flags --------------------------------------------------------
    command:
      - llama-server

      # API key, lives in ./.api-key (chmod 600), mounted read-only as a secret.
      - --api-key-file
      - /run/secrets/qwen_api_key

      # Model: stock UD-IQ4_XS (3 shards). The MTP sidecar was trained against
      # the matching BF16 base model.
      - -m
      - /models/unsloth/Qwen3.8-Flash-Next-GGUF/UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf

      # MTP-only draft head, FR-Spec vocabulary trimming, 65K training context.
      # Only this fork reads it; stock llama.cpp rejects it (missing t2d/d2t).
      - -md
      - /models/drluoto/Qwen3.8-Flash-Next-MTP-GGUF/mtp-Qwen3.8-Flash-Next-Q8_0-frspec-65k.gguf

      # Vision head — NOT part of the validated configuration and unverified here:
      # the MTP workloads are text-only and nothing in this branch's tools/mtmd
      # mentions the qwen4exp arch. If the server dies on "model does not
      # support vision input", drop these two lines and the profile is exactly
      # the plain text-only configuration again.
      - --mmproj
      - /models/unsloth/Qwen3.8-Flash-Next-GGUF/mmproj-BF16.gguf

      # Follow the Frogerric chat template recommandations (https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates#recommended-sampling-parameters)
      # The recommendation is passed in full and explicitly. top-p 0.95 and
      # presence-penalty 0.0 are also the llama-server defaults today; pinning
      # them keeps the sampler fixed if those defaults ever move.
      - --temperature  # 1.0 — the template's recommended setting (default 0.80)
      - "1.0"
      - --top-k          # 20 — sample from the 20 highest-probability tokens (default 40)
      - "20"
      - --top-p          # 0.95 — keep tokens up to 95% cumulative probability (default 0.95)
      - "0.95"
      - --min-p          # 0.0 — no floor relative to the top token's probability (default 0.05)
      - "0.0"
      - --presence-penalty
      - "0.0"          # 0.0 — no penalty for tokens already in the context (default 0.0)

      # MTP speculative decoding: draft the next 3 tokens, accept all of them.
      # p-min 0.0 is what the sidecar was validated with — its draft logits are
      # uncalibrated, so any threshold throws away acceptance for nothing.
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "3"
      - --spec-draft-p-min
      - "0.0"

      # Explicit full offload; the validated host run relied on the branch's
      # auto-fit pass, which offloads every layer on this box.
      - -ngl
      - "999"

      # Flash attention — required to keep long-context attention fast; the MTP
      # verify pass re-reads the K/V cache for every drafted position.
      - -fa
      - "on"

      # Batching from the validated host run, not the EngramHalo 8192/2048
      # recommendation.
      - -b
      - "2048"
      - -ub
      - "2048"

      # 264000 tokens of shared context across 2 slots — each concurrent
      # request can use up to ~132000 tokens (a slot's share of -c).
      # The host run this config came from used 262144 tokens across three
      # slots, so this is not that allocation. For a single full-context
      # session, set --parallel to "1" so one slot owns the whole 264000.
      - -c
      - "264000"
      - --parallel
      - "2"

      # Needed for the parallel slots to actually rotate.
      - --ctx-checkpoints
      - "8"

      # Full-precision K/V: MTP verifies drafts against the cache, and the
      # quantised cache costs acceptance.
      - -ctk
      - f16
      - -ctv
      - f16

      # Model loading mode (-lm is --load-mode): direct I/O, the branch's own
      # recommendation on Strix Halo. Never combine with --no-mmap.
      - -lm
      - dio

      # Use Froggeric's chat template. --jinja has to come before
      # --chat-template-file: without it the server only accepts its built-in
      # templates.
      - --jinja
      - --chat-template-file
      - /models/froggeric/Qwen-Fixed-Chat-Templates/chat_template.jinja
      - --reasoning-format
      - deepseek

      # Keep the reasoning trace in the whole history, not just in the last
      # assistant message. Only meaningful with a template that advertises the
      # supports_preserve_reasoning capability.
      - --reasoning-preserve

      # Disable the bundled web UI — this profile is API-only.
      - --no-webui

      # Listens on all interfaces inside the container. The published port
      # above is 0.0.0.0 too, so the API key is the only thing in front of it.
      - --host
      - 0.0.0.0
      - --port
      - "8080"

      # Friendly OpenAI model name.
      - --alias
      - qwen3.8-flash-next-mtp

# =============================================================================
# Secrets
#
# qwen_api_key is read from ./.api-key (chmod 600) and is required: the service
# passes --api-key-file, so compose fails to start without the file and every
# /v1 request needs the key as a bearer token. To serve without auth, drop the
# secret and the --api-key-file lines.
# Generate with:
#   umask 077 && openssl rand -base64 48 > .api-key
# =============================================================================
secrets:
  qwen_api_key:
    file: ./.api-key
