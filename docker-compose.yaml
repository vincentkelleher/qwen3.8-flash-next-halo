name: qwen38-flash-next

x-qwen-common: &qwen-common
  build:
    context: ./EngramHalo.cpp/docs/strix-halo
    dockerfile: Dockerfile.rocm-7.14
  image: engramhalo:qwen38-flash-rocm-7.14

  restart: unless-stopped

  devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri

  security_opt:
    - seccomp=unconfined

  environment:
    # Recommended by EngramHalo
    ROCBLAS_USE_HIPBLASLT: "1"

  volumes:
    # IMPORTANT: ideally put ./models on your fastest NVMe.
    # mmap/tensor-read-lazy operates directly on these files.
    - ~/Models:/models:ro

  # ./.api-key is mounted at /run/secrets/qwen_api_key (read-only)
  secrets:
    - qwen_api_key

  # Keep the API local to the machine by default.
  # Change 127.0.0.1 to 0.0.0.0 if you want LAN access.
  ports:
    - "0.0.0.0:8080:8080"

  stop_grace_period: 30s

services:

  # -------------------------------------------------------
  # Recommended default
  #
  # 128K context
  # SSD-backed n-gram / engram table
  # MTP speculative decoding
  #
  # docker compose --profile long up -d
  # -------------------------------------------------------
  qwen-long:
    <<: *qwen-common
    profiles:
      - long

    command:
      - llama-server

      # API Key (lives in ./.api-key, mounted read-only by docker compose)
      - --api-key-file
      - /run/secrets/qwen_api_key

      # Model
      - -m
      - /models/unsloth/Qwen3.8-Flash-Next-GGUF/UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf

      # MTP draft model
      - -md
      - /models/EasiiX/Qwen3.8-Flash-Next-MTP-Strix-Halo-GGUF/mtp-Qwen3.8-Flash-Next-Q8_0.gguf

      # Vision Head
      - --mmproj
      - /models/unsloth/Qwen3.8-Flash-Next-GGUF/mmproj-BF16.gguf

      # Offload everything possible
      - -ngl
      - "999"

      # Tensor read lazy
      - --lazy-mode
      - "on"

      # Flash Attention
      - -fa
      - "on"

      # Q8 KV cache
      - -ctk
      - q8_0
      - -ctv
      - q8_0

      # SSD-backed 26.8 GiB engram table
      - -lm
      - mmap

      # 128K context on two slots
      - -c
      - "262144"

      # EngramHalo recommended batching
      - -b
      - "8192"
      - -ub
      - "2048"

      # Recommended for mmap mode
      - -t
      - "4"

      # MTP / sparse gather currently best validated single-slot
      - --parallel
      - "2"

      # Qwen chat template
      - --jinja

      # Default reasoning level (clients can override per-request)
      - --reasoning-effort
      - medium

      # MTP speculative decoding
      - --spec-type
      - draft-mtp,ngram-mod
      - --spec-draft-n-max
      - "4"
      - --spec-draft-p-min
      - "0.75"

      # API only
      - --no-webui

      # Network
      - --host
      - 0.0.0.0
      - --port
      - "8080"

      # Friendly OpenAI model name
      - --alias
      - qwen3.8-flash-next


  # -------------------------------------------------------
  # Vulkan/RADV profile
  #
  # Same long-context server settings as qwen-long, but builds the Vulkan image.
  # docker compose --profile vulkan up -d
  # -------------------------------------------------------
  qwen-vulkan:
    <<: *qwen-common
    build:
      context: ./EngramHalo.cpp/docs/strix-halo
      dockerfile: Dockerfile.vulkan
    image: engramhalo:qwen38-flash-vulkan
    profiles:
      - vulkan

    command:
      - llama-server

      # API Key (lives in ./.api-key, mounted read-only by docker compose)
      - --api-key-file
      - /run/secrets/qwen_api_key

      # Model
      - -m
      - /models/unsloth/Qwen3.8-Flash-Next-GGUF/UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf

      # MTP draft model
      - -md
      - /models/EasiiX/Qwen3.8-Flash-Next-MTP-Strix-Halo-GGUF/mtp-Qwen3.8-Flash-Next-Q8_0.gguf

      # Vision Head
      - --mmproj
      - /models/unsloth/Qwen3.8-Flash-Next-GGUF/mmproj-BF16.gguf

      # Offload everything possible
      - -ngl
      - "999"

      # Tensor read lazy
      - --lazy-mode
      - "on"

      # Flash Attention
      - -fa
      - "on"

      # Q8 KV cache
      - -ctk
      - q8_0
      - -ctv
      - q8_0

      # SSD-backed 26.8 GiB engram table
      - -lm
      - mmap

      # 128K context on two slots
      - -c
      - "262144"

      # EngramHalo recommended batching
      - -b
      - "8192"
      - -ub
      - "2048"

      # Recommended for mmap mode
      - -t
      - "4"

      # MTP / sparse gather currently best validated single-slot
      - --parallel
      - "2"

      # Qwen chat template
      - --jinja

      # Default reasoning level (clients can override per-request)
      - --reasoning-effort
      - medium

      # MTP speculative decoding
      - --spec-type
      - draft-mtp,ngram-mod
      - --spec-draft-n-max
      - "4"
      - --spec-draft-p-min
      - "0.75"

      # API only
      - --no-webui

      # Network
      - --host
      - 0.0.0.0
      - --port
      - "8080"

      # Friendly OpenAI model name
      - --alias
      - qwen3.8-flash-next


  # -------------------------------------------------------
  # Optional turbo profile
  #
  # 32K context
  # keeps the whole engram table in RAM
  #
  # docker compose --profile fast up -d
  # -------------------------------------------------------
  qwen-fast:
    <<: *qwen-common
    profiles:
      - fast

    command:
      - llama-server

      # API Key (lives in ./.api-key, mounted read-only by docker compose)
      - --api-key-file
      - /run/secrets/qwen_api_key

      # Model
      - -m
      - /models/unsloth/Qwen3.8-Flash-Next-GGUF/UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf

      # MTP draft model
      - -md
      - /models/EasiiX/Qwen3.8-Flash-Next-MTP-Strix-Halo-GGUF/mtp-Qwen3.8-Flash-Next-Q8_0.gguf

      # Vision Head
      - --mmproj
      - /models/unsloth/Qwen3.8-Flash-Next-GGUF/mmproj-BF16.gguf

      - -ngl
      - "999"

      - -fa
      - "on"

      - -ctk
      - q8_0
      - -ctv
      - q8_0

      # RAM-backed engram table
      - -lm
      - none

      # 32k context on two slots
      - -c
      - "65536"

      - -b
      - "8192"
      - -ub
      - "2048"

      - -t
      - "4"

      - --parallel
      - "2"

      - --jinja

      # Default reasoning level (clients can override per-request)
      - --reasoning-effort
      - medium

      - --spec-type
      - draft-mtp,ngram-mod
      - --spec-draft-n-max
      - "4"
      - --spec-draft-p-min
      - "0.75"

      - --no-webui

      - --host
      - 0.0.0.0
      - --port
      - "8080"

      - --alias
      - qwen3.8-flash-next


# -------------------------------------------------------
# Secrets
#
# qwen_api_key is read from ./.api-key (chmod 600).
# Regenerate with:
#   umask 077 && openssl rand -base64 48 > .api-key
# -------------------------------------------------------
secrets:
  qwen_api_key:
    file: ./.api-key
